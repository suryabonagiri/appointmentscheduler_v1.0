# ── Server Configuration ──
server.port=8080

# ── Application Metadata ──
spring.application.name=appointment-scheduler

# ── Timezone: All timestamps are strictly UTC ──
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging Configuration ──
logging.level.root=INFO
logging.level.com.scheduling=DEBUG
logging.level.org.springframework.web=INFO

# Console Output Pattern with ANSI Colors
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-35.35logger{34}){cyan} %clr(:){faint} %m%n
